name: Release

# Builds, packages, and publishes the GitHub release with the extension zip
# attached — so the artifact can never be forgotten the way a manual
# `gh release create` can. Fires either way a new version lands:
#   - push to main whose package.json version has no vX.Y.Z tag yet → tags it
#     (bump in a PR, merge, done)
#   - a pushed vX.Y.Z tag (`npm version patch && git push --follow-tags`)
on:
  push:
    branches: [main]
    tags: ['v*']

# Least privilege: the job needs write only to create the release and upload assets.
permissions:
  contents: write

# One global queue: `git push --follow-tags` fires both a main and a tag run;
# serialising them means the second sees the first's tag/release and no-ops.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Decide which tag (if any) this run releases. Tags pushed here with
  # GITHUB_TOKEN don't trigger another workflow run, so the release job below
  # runs in this same run instead.
  tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
      - id: decide
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag="v$(node -p "require('./package.json').version")"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists; nothing to release."
            exit 0
          fi
          git tag "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  release:
    needs: tag
    if: needs.tag.outputs.tag != ''
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.tag.outputs.tag }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      # Node 22 ships npm 10.x; the .npmrc relies on min-release-age (npm 11.10+).
      - run: npm install -g npm@latest
      - run: npm ci
      # Fail fast if the tag and the source version disagree — catches a tag
      # pushed without bumping package.json (or vice versa).
      - name: Check tag matches package.json version
        run: |
          ver="v$(node -p "require('./package.json').version")"
          if [ "$ver" != "$TAG" ]; then
            echo "::error::tag $TAG does not match package.json ($ver)"
            exit 1
          fi
      # wxt zip builds and packages to .output/<name>-<version>-chrome.zip, with
      # the version auto-stamped from package.json (the tag==version guard above
      # already ensures the tag and the packaged version agree). This flat archive
      # (manifest.json at the root) is the Chrome Web Store upload format.
      - run: npm run zip
      # Also fold the build into a folder named after the repo, so users can
      # download, extract, and "Load unpacked" the resulting <repo>/ directory.
      - name: Package as a repo-named folder (unpacked-install zip)
        run: |
          name="${GITHUB_REPOSITORY##*/}"
          ver="$(node -p "require('./package.json').version")"
          mkdir -p .output/pack
          rm -rf ".output/pack/$name"
          cp -r .output/chrome-mv3 ".output/pack/$name"
          ( cd .output/pack && zip -r "$GITHUB_WORKSPACE/${name}-${ver}.zip" "$name" )
      - name: Publish release with both artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$TAG"
          name="${GITHUB_REPOSITORY##*/}"
          ver="$(node -p "require('./package.json').version")"
          store=$(ls .output/*-chrome.zip | head -n1)
          # Idempotent: attach (replacing) the assets if the release already
          # exists — e.g. a re-run — otherwise create it with auto-generated notes.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${name}-${ver}.zip" "$store" --clobber
          else
            gh release create "$tag" "${name}-${ver}.zip" "$store" --title "$tag" --generate-notes
          fi
